name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PRODUCT_NAME: Receivables Operator Preview
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: cashsathi-local.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: cashsathi-local
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: cashsathi-local.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.29
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --directory services/api --frozen --all-groups
      - run: npm run lint:api
      - run: npm run typecheck:api
      - run: npm run test:api

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build API container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
      - name: Build web container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=cashsathi-local.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=cashsathi-local
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=cashsathi-local.firebasestorage.app
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
            NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:ci

  emulator:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PRODUCT_NAME: Receivables Operator Preview
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: cashsathi-local.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: cashsathi-local
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: cashsathi-local.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:local
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.29
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: uv sync --directory services/api --frozen --all-groups
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rules
      - run: firebase emulators:exec --only auth,firestore --project cashsathi-local "bash infra/ci/run-e2e.sh"
