substitutions:
  _REGION: asia-south1
  _REPOSITORY: cashsathi
  _IMAGE_TAG: manual
  _API_BASE_URL: http://localhost:8000
  _FIREBASE_API_KEY: replace-me
  _FIREBASE_AUTH_DOMAIN: replace-me.firebaseapp.com
  _FIREBASE_PROJECT_ID: replace-me
  _FIREBASE_STORAGE_BUCKET: replace-me.firebasestorage.app
  _FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  _FIREBASE_APP_ID: "1:000000000000:web:replace-me"
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/web/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/cashsathi-web:${_IMAGE_TAG}
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/cashsathi-web:${_IMAGE_TAG}
