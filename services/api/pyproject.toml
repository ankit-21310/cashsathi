[project]
name = "cashsathi-api"
version = "0.1.0"
description = "Secure API foundation for the CashSathi receivables operator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "firebase-admin==7.5.0",
  "google-genai==2.14.0",
  "google-cloud-firestore==2.28.1",
  "google-cloud-kms==3.6.0",
  "google-api-python-client==2.179.0",
  "google-auth-oauthlib==1.2.2",
  "iso4217==1.16.20260101",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pypdf==6.15.0",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.2",
  "structlog==26.1.0",
  "tzdata==2026.3",
  "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.3",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashsathi_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=cashsathi_api --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["firestore: integration tests that require the Firestore emulator"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["cashsathi_api"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "firebase_admin.*",
  "google.auth.*",
  "google.oauth2.*",
  "google.cloud.*",
  "google_auth_oauthlib.*",
  "googleapiclient.*",
]
ignore_missing_imports = true
disable_error_code = ["no-untyped-call"]
